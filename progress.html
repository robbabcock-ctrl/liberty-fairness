<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Research Progress</title>
  <link rel="stylesheet" href="dash.css">
  <style>
    #covmap svg { width:100%; height:auto; display:block; }
    #covmap path.st { stroke:#fff; stroke-width:1; }
    .legend { display:flex; flex-wrap:wrap; gap:8px 14px; font-size:13px; color:var(--muted); margin:14px 0 6px; }
    .legend i { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:5px; }
    #covtip { position:fixed; pointer-events:none; background:#fff; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.08); display:none; max-width:260px; }
    .lvl { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; white-space:nowrap; }
    .bg { color:var(--red); font-size:11px; font-weight:700; letter-spacing:.05em; }
  </style>
</head>
<body>
<header><b>Liberty &amp; Fairness</b><nav><a class="on" href="progress.html">Research progress</a><a href="stats.html">Usage</a></nav></header>
<main>
  <p class="asof" id="asof">Loading…</p>
  <div class="tiles">
    <div class="tile"><div class="n" id="c-live">–</div><div class="l">States live: every contest covered (of 51)</div></div>
    <div class="tile"><div class="n" id="c-complete">–</div><div class="l">States complete: fully researched</div></div>
    <div class="tile"><div class="n" id="c-voters">–</div><div class="l">Of 2024 voters live in covered states</div></div>
    <div class="tile"><div class="n" id="c-items">–</div><div class="l">Research pieces done</div></div>
    <div class="tile"><div class="n" id="c-active">–</div><div class="l">Pieces being worked on now</div></div>
  </div>
  <div class="legend" id="covlegend"></div>
  <div id="covmap"></div>
  <div id="covtip"></div>
  <h2>States in priority order</h2>
  <div class="wrap"><table><thead><tr><th>#</th><th>State</th><th>Status</th><th>Done</th><th>Working on now</th></tr></thead><tbody id="covtable"></tbody></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const LEVELS = [
    { name: "Not started", color: "#e5e7eb" },
    { name: "In progress, not live yet", color: "#f4c95d" },
    { name: "Live: every contest covered", color: "#7fa7d6" },
    { name: "Complete: fully researched", color: "#14284b" },
  ];
  let api = "";
  try { api = ((await (await fetch("config.json", { cache: "no-store" })).json()).apiBase || "").replace(/\/$/, ""); } catch (e) {}
  let c;
  try {
    const res = await fetch(api + "/api/public/coverage", { cache: "no-store" });
    if (!res.ok) throw new Error();
    c = await res.json();
  } catch (e) { $("asof").innerHTML = '<span class="err">The server is offline or restarting. Try again in a minute.</span>'; return; }
  const t = c.totals || {};
  $("asof").textContent = "As of " + new Date().toLocaleString();
  $("c-live").textContent = t.live || 0;
  $("c-complete").textContent = t.complete || 0;
  $("c-voters").textContent = t.voters_total_m ? Math.round(100 * t.voters_covered_m / t.voters_total_m) + "%" : "0%";
  $("c-items").textContent = `${t.items_done || 0} / ${t.items || 0}`;
  $("c-active").textContent = t.items_active || 0;
  $("covlegend").innerHTML = LEVELS.map((l) => `<span><i style="background:${l.color}"></i>${l.name}</span>`).join("") + '<span><b class="bg">BG</b> battleground</span>';
  const byFips = Object.fromEntries(c.states.map((s) => [s.fips, s]));
  $("covtable").innerHTML = c.states.map((s) => `<tr><td>${s.rank}</td><td>${esc(s.name)} ${s.battleground ? '<span class="bg">BG</span>' : ""}</td>
    <td><span class="lvl" style="background:${LEVELS[s.level].color};color:${s.level === 3 ? "#fff" : "var(--ink)"}">${LEVELS[s.level].name}</span></td>
    <td>${s.done}/${s.items}</td><td class="muted">${esc((s.working_on || []).join("; "))}</td></tr>`).join("");
  try {
    const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json");
    const feats = topojson.feature(us, us.objects.states).features;
    const path = d3.geoPath();
    const svg = d3.select("#covmap").append("svg").attr("viewBox", "0 0 975 610");
    const tip = $("covtip");
    const show = (ev, f) => {
      const s = byFips[f.id]; if (!s) return;
      tip.style.display = "block";
      tip.style.left = Math.min(ev.clientX + 12, innerWidth - 270) + "px"; tip.style.top = ev.clientY + 12 + "px";
      tip.innerHTML = `<b>${esc(s.name)}</b>${s.battleground ? ' <span class="bg">BG</span>' : ""}<br>${LEVELS[s.level].name}<br>${s.done} of ${s.items} pieces done`
        + (s.working_on && s.working_on.length ? `<br><span class="muted">Now: ${esc(s.working_on.join("; "))}</span>` : "");
    };
    svg.selectAll("path").data(feats).join("path").attr("class", "st").attr("d", path)
      .attr("fill", (f) => LEVELS[(byFips[f.id] || { level: 0 }).level].color)
      .on("mousemove", show).on("click", show).on("mouseleave", () => { tip.style.display = "none"; });
    document.addEventListener("scroll", () => { tip.style.display = "none"; }, { passive: true });
  } catch (e) { $("covmap").innerHTML = '<p class="muted">The map could not load; the table below has the same data.</p>'; }
})();
</script>
</body>
</html>
